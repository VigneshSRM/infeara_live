<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">From telemetry to action</title><desc id="desc">Four circular service stages connect around a central cloud operations hub.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55758d"/></marker><style>
.bg{fill:#f7f8f8}.connector{fill:none;stroke:#55758d;stroke-opacity:.52;stroke-width:2.5;stroke-dasharray:5 7;animation:dash 24s linear infinite}.number{font:700 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#60778a}.label{font:700 21px Inter,Arial,sans-serif;fill:#10243b}.desc{font:400 14px Inter,Arial,sans-serif;fill:#526274}.hub{fill:#10243b;stroke:#e9a18e;stroke-width:5}.hub-text{font:700 17px Inter,Arial,sans-serif;fill:#fff;letter-spacing:1px}.hub-sub{font:400 12px Inter,Arial,sans-serif;fill:#cbd6e1}.node{transform-box:fill-box;transform-origin:center;animation:arrive .8s ease-out both}.node-1{animation-delay:.12s}.node-2{animation-delay:.24s}.node-3{animation-delay:.36s}@keyframes dash{to{stroke-dashoffset:-150}}@keyframes arrive{from{opacity:.35;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.connector,.node{animation:none}}
</style></defs><rect class="bg" width="1400" height="780" rx="20"/><path class="connector" d="M 803 191 Q 1018 180 1070 286" marker-end="url(#arrow)"/><path class="connector" d="M 1070 496 Q 1018 604 803 589" marker-end="url(#arrow)"/><path class="connector" d="M 597 589 Q 382 604 330 496" marker-end="url(#arrow)"/><path class="connector" d="M 330 286 Q 382 180 597 191" marker-end="url(#arrow)"/><g class="node node-0"><circle cx="700" cy="145" r="126" fill="#fff" stroke="#d96854" stroke-width="3"/><circle cx="700" cy="145" r="111" fill="none" stroke="#d96854" stroke-opacity=".14" stroke-width="1"/><text x="700" y="92" text-anchor="middle" class="number">01</text><text x="700" y="127" text-anchor="middle" class="label">Collect</text><text x="700" y="163" text-anchor="middle" class="desc"><tspan x="700" dy="0">Gather useful health and</tspan><tspan x="700" dy="22">performance signals.</tspan></text></g><g class="node node-1"><circle cx="1090" cy="390" r="126" fill="#fff" stroke="#31639a" stroke-width="3"/><circle cx="1090" cy="390" r="111" fill="none" stroke="#31639a" stroke-opacity=".14" stroke-width="1"/><text x="1090" y="337" text-anchor="middle" class="number">02</text><text x="1090" y="372" text-anchor="middle" class="label">Correlate</text><text x="1090" y="408" text-anchor="middle" class="desc"><tspan x="1090" dy="0">Connect alerts with services</tspan><tspan x="1090" dy="22">and owners.</tspan></text></g><g class="node node-2"><circle cx="700" cy="635" r="126" fill="#fff" stroke="#2b7b78" stroke-width="3"/><circle cx="700" cy="635" r="111" fill="none" stroke="#2b7b78" stroke-opacity=".14" stroke-width="1"/><text x="700" y="582" text-anchor="middle" class="number">03</text><text x="700" y="617" text-anchor="middle" class="label">Route</text><text x="700" y="653" text-anchor="middle" class="desc"><tspan x="700" dy="0">Send actionable events to</tspan><tspan x="700" dy="22">responders.</tspan></text></g><g class="node node-3"><circle cx="310" cy="390" r="126" fill="#fff" stroke="#d49a42" stroke-width="3"/><circle cx="310" cy="390" r="111" fill="none" stroke="#d49a42" stroke-opacity=".14" stroke-width="1"/><text x="310" y="337" text-anchor="middle" class="number">04</text><text x="310" y="372" text-anchor="middle" class="label">Tune</text><text x="310" y="408" text-anchor="middle" class="desc"><tspan x="310" dy="0">Review noise, gaps and</tspan><tspan x="310" dy="22">recurring issues.</tspan></text></g><circle class="hub" cx="700" cy="390" r="94"/><text class="hub-text" x="700" y="384" text-anchor="middle">CLOUD</text><text class="hub-text" x="700" y="407" text-anchor="middle">OPERATIONS</text><text class="hub-sub" x="700" y="432" text-anchor="middle">plan · deliver · improve</text></svg>