<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Engineer an LLM solution end to end</title><desc id="desc">Four distinct stages circle a model lifecycle hub.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#226192"/></marker><style>.bg{fill:#EAE6DE}.connector{fill:none;stroke:#226192;stroke-opacity:.52;stroke-width:2.5;stroke-dasharray:5 7;animation:dash 24s linear infinite}.number{font:700 11px Inter,Arial,sans-serif;letter-spacing:2px;fill:#226192}.label{font:700 21px Inter,Arial,sans-serif;fill:#226192}.detail{font:400 14px Inter,Arial,sans-serif;fill:#226192}.hub{fill:#226192;stroke:#EF8557;stroke-width:5}.hub-text{font:700 16px Inter,Arial,sans-serif;fill:#EAE6DE;letter-spacing:1px}.hub-sub{font:400 12px Inter,Arial,sans-serif;fill:#EAE6DE}.node{transform-box:fill-box;transform-origin:center;animation:arrive .8s ease-out both}.node-1{animation-delay:.12s}.node-2{animation-delay:.24s}.node-3{animation-delay:.36s}@keyframes dash{to{stroke-dashoffset:-150}}@keyframes arrive{from{opacity:.35;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.connector,.node{animation:none}}</style></defs><rect class="bg" width="1400" height="780" rx="20"/><path class="connector" d="M 803 191 Q 1018 180 1070 286" marker-end="url(#arrow)"/><path class="connector" d="M 1070 496 Q 1018 604 803 589" marker-end="url(#arrow)"/><path class="connector" d="M 597 589 Q 382 604 330 496" marker-end="url(#arrow)"/><path class="connector" d="M 330 286 Q 382 180 597 191" marker-end="url(#arrow)"/><g class="node node-0"><circle cx="700" cy="145" r="126" fill="#EAE6DE" stroke="#EF8557" stroke-width="3"/><circle cx="700" cy="145" r="111" fill="none" stroke="#EF8557" stroke-opacity=".14"/><text x="700" y="92" text-anchor="middle" class="number">STEP 01</text><text x="700" y="127" text-anchor="middle" class="label">Select</text><text x="700" y="163" text-anchor="middle" class="detail"><tspan x="700" dy="0">Match a model to task and</tspan><tspan x="700" dy="22">constraints.</tspan></text></g><g class="node node-1"><circle cx="1090" cy="390" r="126" fill="#EAE6DE" stroke="#226192" stroke-width="3"/><circle cx="1090" cy="390" r="111" fill="none" stroke="#226192" stroke-opacity=".14"/><text x="1090" y="337" text-anchor="middle" class="number">STEP 02</text><text x="1090" y="372" text-anchor="middle" class="label">Ground</text><text x="1090" y="408" text-anchor="middle" class="detail"><tspan x="1090" dy="0">Connect controlled data and</tspan><tspan x="1090" dy="22">tools.</tspan></text></g><g class="node node-2"><circle cx="700" cy="635" r="126" fill="#EAE6DE" stroke="#226192" stroke-width="3"/><circle cx="700" cy="635" r="111" fill="none" stroke="#226192" stroke-opacity=".14"/><text x="700" y="582" text-anchor="middle" class="number">STEP 03</text><text x="700" y="617" text-anchor="middle" class="label">Evaluate</text><text x="700" y="653" text-anchor="middle" class="detail"><tspan x="700" dy="0">Measure quality, risk and cost.</tspan></text></g><g class="node node-3"><circle cx="310" cy="390" r="126" fill="#EAE6DE" stroke="#EF8557" stroke-width="3"/><circle cx="310" cy="390" r="111" fill="none" stroke="#EF8557" stroke-opacity=".14"/><text x="310" y="337" text-anchor="middle" class="number">STEP 04</text><text x="310" y="372" text-anchor="middle" class="label">Deploy</text><text x="310" y="408" text-anchor="middle" class="detail"><tspan x="310" dy="0">Monitor versions and live</tspan><tspan x="310" dy="22">behavior.</tspan></text></g><circle class="hub" cx="700" cy="390" r="94"/><text class="hub-text" x="700" y="384" text-anchor="middle">LLM ENGINEERING</text><text class="hub-sub" x="700" y="411" text-anchor="middle">model lifecycle</text></svg>